[workspace]
resolver = "2"
members = [
  "crates/alos-db",
  "crates/alos-engine",
  "crates/alos-modules",
  "crates/alos-api",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["ALOS Learner"]

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tower-governor = { version = "0.5", features = ["axum"], package = "tower_governor" }

# database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# validation
validator = { version = "0.20", features = ["derive"] }

# auth
argon2 = "0.5"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }

# time
chrono = { version = "0.4", features = ["serde"] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# error handling
thiserror = "2"
anyhow = "1"

# misc
rand = "0.8"